.topbar { border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.card-label { font-size: 9px; letter-spacing: 3px; color: var(--muted); margin-bottom: 4px; font-family: monospace; }
.card-date { font-size: 16px; font-weight: 700; font-family: monospace; letter-spacing: 1px; margin-bottom: 20px; color: var(--text); }

.card-crew { font-size: 9px; letter-spacing: 2px; color: var(--muted); margin-top: 4px; font-family: monospace; }

.detail-wrap { display: flex; gap: 1px; background: var(--border); border: 1px solid var(--border); align-items: flex-start; }
.panel { background: var(--bg); flex: 1; min-width: 0; }
.panel-name { background: var(--bg); flex: 1; min-width: 0; position: sticky; top: 0; max-height: 100vh; overflow-y: auto; }
.panel-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.panel-title { font-size: 9px; letter-spacing: 3px; color: var(--accent); font-family: monospace; }
.panel-sub { font-size: 9px; letter-spacing: 2px; color: var(--muted); font-family: monospace; }

.part-row { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border); border-left: 2px solid transparent; padding: 20px 24px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.15s; color: var(--text); text-align: left; }
.part-row:last-child { border-bottom: none; }
.part-row:hover { background: #1a1a1a; }
.part-row.active { background: #1C1C1C; border-left: 2px solid var(--accent); }
.part-name { font-size: 13px; letter-spacing: 1px; font-family: monospace; color: var(--text); }
.part-row.active .part-name { color: var(--accent); }
.part-count { font-size: 22px; font-weight: 300; color: var(--muted); }
.part-row.active .part-count { color: var(--accent); }

.name-row { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
.name-row:last-child { border-bottom: none; }
.name-num { font-size: 9px; color: var(--accent); font-family: monospace; min-width: 24px; opacity: 0.7; }

.loading { text-align: center; padding: 60px; font-size: 9px; letter-spacing: 4px; color: var(--muted); font-family: monospace; }

  </div>

  <script>
    const API_URL = 'https://sethbefree.github.io/-coach-crew-dashboard/data.json';

    let crewData = {};
    let selectedDate = null;
    let selectedPart = null;

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        crewData = await res.json();
        renderDates();
        renderDetail();
      } catch (e) {
        document.getElementById('date-grid').innerHTML = '<div class="loading">ERROR LOADING DATA</div>';
      }
    }

    function renderDates() {
      const grid = document.getElementById('date-grid');
      grid.innerHTML = '';
      Object.entries(crewData).forEach(([date, info]) => {
        const card = document.createElement('button');
        card.className = 'date-card' + (selectedDate === date ? ' active' : '');
        card.innerHTML =
          '<div class="card-label">' + (info.label || '') + '</div>' +
          '<div class="card-date">' + date + '</div>' +
          '<div class="card-total">' + info.total + '</div>' +
          '<div class="card-crew">CREW</div>';
        card.onclick = function() {
          selectedDate = selectedDate === date ? null : date;
          selectedPart = null;
          renderDates();
          renderDetail();
        };
        grid.appendChild(card);
      });
    }

    function renderDetail() {
      const area = document.getElementById('detail-area');
      if (!selectedDate) {
        area.innerHTML = '<div class="empty">SELECT A DATE TO VIEW CREW DETAILS</div>';
        return;
      }

      const info = crewData[selectedDate];
      const parts = Object.entries(info.groups || {});

      let html = '<div class="detail-wrap">';

      // Part Panel
      html += '<div class="panel"><div class="panel-header"><span class="panel-title">DEPARTMENTS</span><span class="panel-sub">' + selectedDate + '</span></div>';
      parts.forEach(function(entry) {
        const part = entry[0];
        const names = entry[1];
        const isActive = selectedPart === part;
        html += '<button class="part-row' + (isActive ? ' active' : '') + '" onclick="selectPart(\'' + part.replace(/'/g, "\\'") + '\')">' +
          '<span class="part-name">' + part + '</span>' +
          '<span class="part-count">' + names.length + '</span>' +
          '</button>';
      });
      html += '</div>';

      // Name Panel
      if (selectedPart && info.groups[selectedPart]) {
        const names = info.groups[selectedPart];
        html += '<div class="panel-name"><div class="panel-header"><span class="panel-title">' + selectedPart + '</span><span class="panel-sub">' + names.length + ' CREW</span></div>';
        names.forEach(function(person, i) {
          html += '<div class="name-row"><span class="name-num">' + String(i+1).padStart(2,'0') + '</span><span class="name-text">' + person.name + '</span></div>';
        });
        html += '</div>';
      }

      html += '</div>';
      area.innerHTML = html;
    }

    function selectPart(part) {
      selectedPart = selectedPart === part ? null : part;
      renderDetail();
    }

    loadData();

    // Pull to refresh
    let startY = 0;
    let isPulling = false;
    const threshold = 80;

    document.addEventListener('touchstart', function(e) {
      if (window.scrollY === 0) {
        startY = e.touches[0].clientY;
        isPulling = true;
      }
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
      if (!isPulling) return;
      const diff = e.touches[0].clientY - startY;
      if (diff > 10 && window.scrollY === 0) {
        document.body.style.transform = 'translateY(' + Math.min(diff * 0.4, 40) + 'px)';
      }
    }, { passive: true });

    document.addEventListener('touchend', function(e) {
      if (!isPulling) return;
      const diff = e.changedTouches[0].clientY - startY;
      document.body.style.transform = '';
      document.body.style.transition = 'transform 0.3s';
      setTimeout(function() { document.body.style.transition = ''; }, 300);
      if (diff > threshold && window.scrollY === 0) {
        loadData();
      }
      isPulling = false;
    }, { passive: true });
  </script>
